[project]
name = "research-landscape-api"
version = "0.1.0"
description = "AI Research Landscape Agent — arXiv retrieval, reranking, extraction, and synthesis."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: requires network access to arXiv and a real LLM key (deselected by default)",
]
# Offline by default. Live tests must opt in explicitly:
#   RUN_LIVE_TESTS=1 python -m pytest -m live
addopts = "-q -m 'not live'"

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".venv", "data", "__pycache__"]

[tool.ruff.lint]
# Bug-level rules only, matching the RAG-Pipeline convention.
select = ["E4", "E7", "E9", "F", "B", "I"]
ignore = ["B008"]  # FastAPI dependency injection needs calls in argument defaults

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_redundant_casts = true
no_implicit_optional = true
files = ["config.py", "store.py", "models.py", "pipeline/rerank.py", "pipeline/cluster.py"]
